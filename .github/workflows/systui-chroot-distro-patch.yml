name: Apply chroot-distro integration

on:
  push:
    paths:
      - '.github/workflows/systui-chroot-distro-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch distro manager installer
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/patch-chroot-distro.py
          python3 /tmp/patch-chroot-distro.py
          bash -n src/features/rootfs.sh
          grep -q 'git+https://github.com/sabamdarif/chroot-distro.git' src/features/rootfs.sh
          grep -q '^chroot-distro|chroot-distro|' src/features/rootfs.sh
      - name: Commit integration and remove one-shot workflow
        shell: bash
        run: |
          rm -f .github/workflows/systui-chroot-distro-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/rootfs.sh .github/workflows/systui-chroot-distro-patch.yml
          git commit -m "feat: install chroot-distro from upstream GitHub"
          git push
