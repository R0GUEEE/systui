name: one-time legacy safety cleanup

on:
  push:
    paths:
      - .github/workflows/legacy-cleanup-once.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply cleanup
        run: python3 tools/legacy_cleanup_once.py
      - name: Validate cleanup
        shell: bash
        run: |
          set -euo pipefail
          bash -n update.sh
          bash -n src/core/common.sh
          bash -n src/features/rootfs.sh
          bash -n src/features/sysconfig.sh
          bash tests/test-audit-fixes.sh
      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add update.sh src/core/common.sh src/features/rootfs.sh src/features/sysconfig.sh
          git diff --cached --check
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'refactor: remove obsolete Homebrew identity spoofing'
          git push origin HEAD:main
