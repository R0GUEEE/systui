name: Dependency matrix

# Installs share/systui-deps.tsv inside one container per distribution family
# and checks that every command the manifest promises really exists there.
# A wrong package name — or a distribution that splits a package differently —
# fails here instead of in a user's install.
#
# The containers are started with `docker run` from the runner rather than via
# `jobs.<id>.container`: the Void image has no libstdc++, which the runner's
# node binary needs before a single step can run.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit the manifest and the generated documentation
        run: python3 tools/deps-audit.py --check
      - name: Print the install command for every family
        run: |
          set -euo pipefail
          for pm in apt apk pacman dnf zypper xbps emerge; do
            printf '%-8s ' "$pm"
            SYSTUI_PM_OVERRIDE=$pm sh install.sh --print-deps
          done

  install:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: debian:12
            pm: apt
          - image: ubuntu:24.04
            pm: apt
          - image: alpine:3.22
            pm: apk
          - image: archlinux:latest
            pm: pacman
          - image: fedora:41
            pm: dnf
          - image: opensuse/tumbleweed:latest
            pm: zypper
          # Void's official "full" image ships a working xbps database; the
          # bare image fails its repo sync inside the runner's sandbox.
          - image: ghcr.io/void-linux/void-glibc-full:latest
            pm: xbps
    steps:
      - uses: actions/checkout@v5

      - name: Install and verify inside ${{ matrix.image }}
        env:
          PM: ${{ matrix.pm }}
          # Arch needs a full upgrade before new packages; the installer only
          # does that when explicitly allowed. Ignored by the other managers.
          SYSTUI_ALLOW_FULL_UPGRADE: '1'
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/repo" -w /repo \
            -e PM -e SYSTUI_ALLOW_FULL_UPGRADE \
            "${{ matrix.image }}" sh -ec '
              echo "== installing the manifest dependency set ($PM)"
              sh install.sh --deps-only
              echo "== verifying every declared command"
              sh tools/deps-verify.sh "$PM"
              echo "== the installer still works afterwards"
              sh install.sh --print-deps >/dev/null
            '
