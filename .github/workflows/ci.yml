name: systui CI

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  shell-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Apply Rootfs bootstrap changes
        if: github.ref == 'refs/heads/fix/rootfs-bootstrap-multiselect-minimal-2026-08-29' && github.event.head_commit.message == 'chore: run rootfs bootstrap patcher'
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/apply-rootfs-bootstrap-ui-fix.py
          bash -n src/features/rootfs.sh
          bash tests/test-regressions.sh
          rm -f tools/apply-rootfs-bootstrap-ui-fix.py
          git fetch origin main
          git show FETCH_HEAD:.github/workflows/ci.yml > .github/workflows/ci.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/features/rootfs.sh tests/test-regressions.sh .github/workflows/ci.yml tools/apply-rootfs-bootstrap-ui-fix.py
          git commit -m 'feat(rootfs): multi-select bootstraps and default minimal builds'
          git push origin HEAD:fix/rootfs-bootstrap-multiselect-minimal-2026-08-29
      - name: Verify ShellCheck is available
        run: command -v shellcheck >/dev/null
      - name: Bash syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' f; do
            bash -n "$f"
          done < <(find . -type f -name '*.sh' -print0)
      - name: ShellCheck core and changed-risk paths
        shell: bash
        run: |
          set -euo pipefail
          shellcheck -S warning -x \
            install.sh update.sh \
            src/core/*.sh \
            src/features/health.sh \
            src/features/zz-rootfs-distro-managers.sh \
            share/homebrew/install-homebrew-root.sh
      - name: Regression tests
        shell: bash
        run: |
          set -euo pipefail
          for t in tests/test-*.sh; do
            echo "===== $t ====="
            bash "$t"
          done
