name: systui CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shell-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Verify ShellCheck is available
        run: command -v shellcheck >/dev/null

      - name: Bash syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' f; do
            bash -n "$f"
          done < <(find . -type f -name '*.sh' -print0)

      - name: ShellCheck every shell script for errors
        shell: bash
        run: |
          set -euo pipefail
          legacy='src/features/zzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzz-sysconfig-audit-fixes.sh'
          mapfile -d '' files < <(find . -type f -name '*.sh' ! -path "./$legacy" -print0)
          shellcheck -S error -x "${files[@]}"
          shellcheck -S error -e SC2081 -x "$legacy"

      - name: ShellCheck critical runtime paths for warnings
        shell: bash
        run: |
          set -euo pipefail
          shellcheck -S warning -x \
            install.sh update.sh \
            src/core/*.sh \
            src/rootfs/*.sh \
            src/sysconfig/*.sh \
            src/features/00-platform-bootstrap.sh \
            src/features/20-rootfs-foundation.sh \
            src/features/21-rootfs-backends.sh \
            src/features/30-health-runtime-capabilities.sh \
            src/features/40-rootfs-init-manager.sh \
            src/features/50-sysconfig-repository-input.sh \
            src/features/60-rootfs-docker-image-normalization.sh \
            src/features/90-install-guard-final.sh \
            src/features/91-rootfs-exec-final.sh \
            src/features/health.sh \
            src/features/zz-rootfs-distro-managers.sh \
            src/features/*platform-final.sh \
            src/features/*argmax-cleanup.sh \
            share/homebrew/install-homebrew-root.sh
          shellcheck -S warning -e SC1090 -x src/provision/runtime.sh

      - name: Core runtime invariants
        shell: bash
        run: |
          set -euo pipefail
          modern=(
            src/core/tui-widgets.sh
            src/core/platform.sh
            src/core/loader.sh
            src/core/strict-exec.sh
            src/core/package-map-data.sh
            src/rootfs/api.sh
            src/rootfs/metadata.sh
            src/rootfs/filesystem.sh
            src/rootfs/backends.sh
            src/sysconfig/repositories.sh
          )
          if grep -nE '^[[:space:]]*export[[:space:]]+-f([[:space:]]|$)' "${modern[@]}"; then
            echo 'Modern core/rootfs/sysconfig modules must not export Bash functions.' >&2
            exit 1
          fi
          if grep -nE -- '--(menu|radiolist|checklist|textbox|msgbox|yesno|inputbox|passwordbox|gauge)[^#]*[[:space:]][0-9]+[[:space:]][0-9]+' src/core/tui-widgets.sh; then
            echo 'TUI widgets must use responsive geometry rather than fixed dimensions.' >&2
            exit 1
          fi
          if grep -nE 'declare -f .*\|[[:space:]]*(sed|awk)' src/core/*.sh src/rootfs/*.sh src/sysconfig/*.sh src/features/[0-9][0-9]-*.sh; then
            echo 'Modern modules must preserve functions with Bash builtins, not external declare-f pipelines.' >&2
            exit 1
          fi

      - name: Feature manifest integrity
        shell: bash
        run: |
          set -euo pipefail
          manifest=src/features/.load-order
          test -s "$manifest"
          test -z "$(grep -vE '^[[:space:]]*(#|$)' "$manifest" | sort | uniq -d)"
          while IFS= read -r rel || [ -n "$rel" ]; do
            case "$rel" in ''|'#'*) continue;; esac
            test -f "src/features/$rel" || { echo "missing manifest feature: $rel" >&2; exit 1; }
          done < "$manifest"
          last=$(grep -vE '^[[:space:]]*(#|$)' "$manifest" | tail -n1)
          case "$last" in *-rootfs-ish-argmax-cleanup.sh) ;; *) echo "ARG_MAX cleanup must load last; found: $last" >&2; exit 1;; esac

      - name: Regression and integration tests
        shell: bash
        run: |
          set -euo pipefail
          for t in tests/test-*.sh; do
            echo "===== $t ====="
            bash "$t"
          done

  busybox-portability:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Alpine / BusyBox syntax and focused tests
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/repo" -w /repo alpine:3.22 sh -ec '
            apk add --no-cache bash coreutils ncurses shellcheck >/dev/null
            bash -n src/core/platform.sh
            bash -n src/core/tui-widgets.sh
            bash -n src/core/loader.sh
            bash -n src/core/strict-exec.sh
            bash -n src/core/package-map-data.sh
            bash -n src/rootfs/api.sh
            bash -n src/rootfs/metadata.sh
            bash -n src/rootfs/filesystem.sh
            bash -n src/rootfs/backends.sh
            bash -n src/sysconfig/repositories.sh
            bash tests/test-core-polish.sh
            bash tests/test-package-map-data.sh
            bash tests/test-rootfs-filesystem-module.sh
            bash tests/test-rootfs-backends-module.sh
            bash tests/test-rootfs-init-transaction.sh
          '
