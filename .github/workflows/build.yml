name: Build iOS app
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer || true
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build unsigned app
        run: |
          xcodebuild -project SystuiRootfs.xcodeproj -scheme SystuiRootfs \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" | tee build.log
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/SystuiRootfs.app Payload/
          zip -qr SystuiRootfs.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: SystuiRootfs-unsigned-IPA
          path: SystuiRootfs.ipa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xcode-build-log
          path: build.log
