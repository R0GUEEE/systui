name: SystuiRootfs
options:
  bundleIdPrefix: com.r0gueee
  deploymentTarget:
    iOS: "16.0"
targets:
  SystuiRootfs:
    type: application
    platform: iOS
    sources:
      - path: Sources/SystuiRootfs
    info:
      path: Sources/SystuiRootfs/Info.plist
      properties:
        CFBundleDisplayName: Systui Rootfs
        # XcodeGen otherwise falls back to Xcode's defaults (1.0), which is how
        # the first IPA ended up claiming 1.0 while the project said 0.1.0.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportsDocumentBrowser: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.r0gueee.systui-rootfs
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.3.0"
        CURRENT_PROJECT_VERSION: "3"
